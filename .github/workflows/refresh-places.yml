name: Refresh Google Places photos

# Google's terms allow photo references to be kept for 30 days, so refresh them twice a month.
# Uses the PLACES_API_KEY repository secret if one is set, otherwise the browser key in config.js.
on:
  schedule:
    - cron: "17 9 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look up places and photos
        run: |
          if [ -z "$PLACES_API_KEY" ] && ! grep -Eq 'PLACES_API_KEY = "[^"]+"' config.js; then
            echo "No Places API key configured yet; nothing to refresh."; exit 0
          fi
          python3 scripts/fetch_places.py
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      - name: Commit the refreshed references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.js
          git diff --cached --quiet || git commit -m "Refresh Google Places photo references"
          git push
